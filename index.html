<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dance Runner PRO</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:#ff9eb5;text-align:center;font-family:sans-serif;overflow:hidden}
  h1{color:white;margin:8px;text-shadow:2px 2px 0 #ff5e8a}
  #scoreBar{background:white;display:inline-block;padding:7px 16px;border-radius:20px;font-weight:bold}
  #game{position:relative;width:100%;max-width:800px;height:380px;margin:10px auto;background:linear-gradient(#7ec8ff 0%, #c2f0ff 55%, #fff2cc 55%, #a8e6a3 100%);border-radius:15px;overflow:hidden;border:4px solid white}
  #ground{position:absolute;bottom:0;width:100%;height:60px;background:#7ec850}
  #road{position:absolute;bottom:55px;width:100%;height:8px;background:#8b5a2b}
  #player{position:absolute;left:80px;bottom:55px;width:110px;height:240px;z-index:10}
  #player img{width:100%;height:100%;object-fit:contain;transform-origin:bottom center}
  .running img{animation:runBody .45s infinite}
  @keyframes runBody{0%,100%{transform:translateY(0) rotate(-1deg)}50%{transform:translateY(-7px) rotate(1deg) scaleY(1.02)}}
  .jumping img{animation:none !important;transform:scale(1.05) !important}
  .dancing img{animation:dancePro .35s infinite !important}
  @keyframes dancePro{0%{transform:rotate(-9deg) scale(1.06) translateX(-6px)}50%{transform:rotate(9deg) scale(1.08) translateX(6px)}100%{transform:rotate(-9deg) scale(1.06) translateX(-6px)}}
  .obstacle{position:absolute;bottom:55px;font-size:38px;z-index:5}
  .star{position:absolute;font-size:30px;z-index:5;animation:spin 1s infinite}
  @keyframes spin{0%{transform:rotate(0)}100%{transform:rotate(360deg)}}
  #gameover{position:absolute;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.6);color:white;display:none;justify-content:center;align-items:center;flex-direction:column;z-index:20}
  button{padding:13px 24px;font-size:18px;border:none;border-radius:14px;cursor:pointer;background:white;margin:5px;font-weight:bold}
  #btnJump{background:#ffd93d} #btnDance{background:#ff6bcb;color:white} #btnRestart{background:#4ade80;color:white}
</style>
</head>
<body>
<h1>💃 Dance Runner PRO</h1>
<div id="scoreBar">⭐ النقاط: <span id="score">0</span> | ❤️ <span id="lives">3</span> | 🏆 أفضل: <span id="best">0</span></div>

<div id="game">
  <div id="ground"></div><div id="road"></div>
  <div id="player" class="running"><img src="girl.jpeg" alt="girl"></div>
  <div id="gameover">
    <h2>😢 خسرت!</h2>
    <p style="font-size:20px;margin-bottom:15px">نقاطك: <span id="finalScore">0</span></p>
    <button id="btnRestart" onclick="restart()">🔄 العب مرة أخرى</button>
  </div>
</div>

<div>
  <button id="btnJump" onclick="jump()">🦘 قفز</button>
  <button id="btnDance" onclick="dance()">💃 رقص</button>
</div>
<p style="color:white;margin-top:5px">مسافة = قفز | D = رقص</p>

<script>
let score=0, lives=3, isJumping=false, isDancing=false, gameOver=false, speed=5;
let player=document.getElementById('player');
let best=localStorage.getItem('best')||0;
document.getElementById('best').textContent=best;
function jump(){
  if(isJumping||gameOver) return;
  isJumping=true;
  player.classList.remove('running');
  player.classList.add('jumping');
  let y=0, vy=-16;
  let up=setInterval(()=>{
    y+=vy; vy+=0.9;
    player.style.bottom=(55 - y)+'px';
    if(y>=0){ clearInterval(up); player.style.bottom='55px'; isJumping=false; player.classList.remove('jumping'); if(!isDancing) player.classList.add('running'); }
  },20);
}
function dance(){
  if(isDancing||gameOver) return;
  isDancing=true;
  player.classList.remove('running');
  player.classList.add('dancing');
  score+=15; updateScore();
  setTimeout(()=>{ isDancing=false; player.classList.remove('dancing'); if(!isJumping) player.classList.add('running'); },800);
}
function updateScore(){ document.getElementById('score').textContent=score; if(score>best){best=score;localStorage.setItem('best',best);document.getElementById('best').textContent=best;} }
function restart(){ location.reload(); }
document.addEventListener('keydown',e=>{
  if(e.code==='Space'){e.preventDefault();jump();}
  if(e.key==='d'||e.key==='D') dance();
});
let gameEl=document.getElementById('game');
function spawn(){
  if(gameOver) return;
  if(Math.random()<0.5){
    let o=document.createElement('div'); o.className='obstacle'; o.textContent=Math.random()<0.5?'🧱':'🌵';
    o.style.left='800px'; gameEl.appendChild(o);
    let x=800;
    let mv=setInterval(()=>{
      if(gameOver){clearInterval(mv);return;}
      x-=speed; o.style.left=x+'px';
      if(x>60 && x<140 && !isJumping){
        o.remove(); clearInterval(mv);
        lives--; document.getElementById('lives').textContent=lives;
        player.style.filter='brightness(0.6)';
        setTimeout(()=>player.style.filter='none',300);
        if(lives<=0){ gameOver=true; document.getElementById('finalScore').textContent=score; document.getElementById('gameover').style.display='flex'; }
      }
      if(x<-50){ clearInterval(mv); o.remove(); score+=5; updateScore(); }
    },20);
  } else {
    let s=document.createElement('div'); s.className='star'; s.textContent='⭐';
    s.style.left='800px'; s.style.bottom=(150+Math.random()*80)+'px'; gameEl.appendChild(s);
    let x=800;
    let mv=setInterval(()=>{
      if(gameOver){clearInterval(mv);return;}
      x-=speed; s.style.left=x+'px';
      if(x>70 && x<160){ s.remove(); clearInterval(mv); score+=10; updateScore(); }
      if(x<-50){ clearInterval(mv); s.remove(); }
    },20);
  }
  speed=Math.min(9, 5 + score/100);
}
setInterval(spawn, 900);
</script>
</body>
</html>
